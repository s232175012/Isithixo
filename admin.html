<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isithixo Admin</title>
<style>
body{font-family:system-ui;padding:14px;background:#f7f7f7} .admin-card{background:#fff;border:2px solid #111;border-radius:14px;padding:12px;margin-top:12px}
input,select{width:100%;padding:10px;border:1.5px solid #111;border-radius:10px;margin:6px 0}
.btn{padding:12px;border-radius:999px;border:2px solid #111;font-weight:900;cursor:pointer;width:100%;margin-top:6px}
.btn-black{background:#111;color:#fff}
.tab{padding:8px 12px;border:1.5px solid #111;border-radius:999px;font-weight:800;background:#fff;cursor:pointer}
.tab.active{background:#111;color:#fff}
.upload-box{border:1.5px dashed #111;border-radius:12px;padding:8px;text-align:center;margin:4px}
.prev{width:100%;height:80px;object-fit:cover;border-radius:8px;display:none}
.hidden{display:none}
</style>
</head>
<body>
<h2 style="letter-spacing:3px">ISTHIXO ADMIN</h2>
<div id="loginBox" class="admin-card">
  <h3>Login</h3>
  <input id="lUser" placeholder="admin / isithixo">
  <input id="lPass" type="password" placeholder="Password">
  <div id="lError" style="color:red;font-size:12px"></div>
  <button class="btn btn-black" onclick="adminLogin()">LOGIN</button>
  <small>Use isithixo@admin.com / Isithixo2026!</small>
</div>
<div id="adminPanel" class="hidden">
  <div style="display:flex;gap:8px"><button class="tab active" onclick="switchTab('products')">Products</button><button class="tab" onclick="switchTab('orders')">Orders</button><button class="tab" onclick="adminLogout()">Logout</button></div>
  <div id="tab-products" class="admin-card">
    <h3>Add Product</h3>
    <input id="aName" placeholder="Product Name e.g Isithixo Hoodie">
    <input id="aPrice" type="number" placeholder="Price e.g 350">
    <select id="aCat"><option>Hoodie</option><option>Shorts</option><option>T-Shirt</option><option>Jeans</option><option>Drip</option><option>Cap</option></select>
    <input id="aSizes" placeholder="Sizes S:5,M:10,L:3,XL:2">
    <div style="display:grid;grid-template-columns:repeat(3,1fr)">
      <div class="upload-box"><input type="file" id="up0" accept="image/*" onchange="handleImg(this,0)"><img id="prev0" class="prev"></div>
      <div class="upload-box"><input type="file" id="up1" accept="image/*" onchange="handleImg(this,1)"><img id="prev1" class="prev"></div>
      <div class="upload-box"><input type="file" id="up2" accept="image/*" onchange="handleImg(this,2)"><img id="prev2" class="prev"></div>
      <div class="upload-box"><input type="file" id="up3" accept="image/*" onchange="handleImg(this,3)"><img id="prev3" class="prev"></div>
      <div class="upload-box"><input type="file" id="up4" accept="image/*" onchange="handleImg(this,4)"><img id="prev4" class="prev"></div>
    </div>
    <button class="btn btn-black" onclick="addProduct()">PUBLISH TO FIREBASE</button>
    <div id="adminProducts" style="margin-top:12px"></div>
  </div>
  <div id="tab-orders" class="admin-card hidden">
    <h3>Orders</h3>
    <table border="1" style="width:100%;font-size:11px;border-collapse:collapse"><tbody id="adminOrders"></tbody></table>
  </div>
</div>
<script src="isithixo.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyBeaXMto9uEuqswlZNB4zWgTuNLhGKY1mM",
  authDomain: "mamthethwa-db.firebaseapp.com",
  projectId: "mamthethwa-db",
  storageBucket: "mamthethwa-db.firebasestorage.app",
  messagingSenderId: "884680583899",
  appId: "1:884680583899:web:685d16794860485afd7afe"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
window.db = db;
window.auth = auth;
window.fbMethods = { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, signInWithEmailAndPassword, signOut, onAuthStateChanged };
</script>
</body>
</html>
